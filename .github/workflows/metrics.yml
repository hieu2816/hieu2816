name: Metrics
on:
  # Chạy tự động mỗi 12 tiếng
  schedule: [{cron: "0 */12 * * *"}]
  # Cho phép bạn bấm nút chạy thủ công bất cứ lúc nào
  workflow_dispatch:
  # Chạy mỗi khi bạn update file README
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Advanced Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Cấu hình chung
          user: hieu2816
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh

          # --- PLUGIN 1: LANGUAGES (Phân tích ngôn ngữ chuyên sâu) ---
          plugin_languages: yes
          plugin_languages_ignored: html, css, cmake # Ẩn các ngôn ngữ phụ như mong muốn của bạn
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes # Quét sâu vào bên trong các repo con
          plugin_languages_limit: 8

          # --- PLUGIN 2: ISOCALENDAR (Lịch đóng góp 3D) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year # Hiển thị nửa năm gần nhất cho vừa vặn bố cục
